

name: OpenSim native probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download and verify OpenSim
        run: |
          set -euo pipefail
          mkdir -p wheel
          python -m pip download --no-deps --only-binary=:all: 'opensim==4.6' -d wheel
          python scripts/verify_wheel.py wheel

      - name: Install OpenSim
        run: |
          python -m pip install wheel/*.whl
          python scripts/native_probe.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensim-native-probe
          path: |
            native_probe.json
            wheel/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
